<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mediaQuery.css">
    <title>Login</title>
</head>
<body>
    <main>
            <div id="login">
                <div id="imagem"></div>
                <div id="infos">
                <h1>Login</h1>
                <p>Seja bem-vindo novamente. Faça login para acessar sua conta e poder fazer as configuraçoes no seu ambiente.</p>
                <form action="cadastro.php" method="get" autocomplete="on">
                        
                            
                            <label for="usuario">Usuario:</label>
                            <input type="email" name="usuario" id="usuario" autocomplete="email" required placeholder="seu email"> <br>
                        
                        
                            <label for="senha">Senha:</label>
                            <input type="password" name="senha" id="senha" maxlength="8" required placeholder="sua senha" autocomplete="current-password"> <br>
                        
                             <input type="submit" value="Entrar" id="entrar">
                            <a href="#">Esqueci a senha</a>
                        </form>
                    </div>
            </div>
    </main>
</body>
</html>
